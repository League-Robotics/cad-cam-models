; Robot display firmware for the Waveshare ESP32-S3-Touch-LCD-1.69.
; Build:  ~/.platformio/penv/bin/pio run
; Flash:  ~/.platformio/penv/bin/pio run -t upload --upload-port /dev/cu.usbmodemXXXX
; The chip is an ESP32-S3R8 (8 MB octal PSRAM) with 16 MB flash; the native
; USB port is the hardware USB-Serial/JTAG, which is also the console.
[env:waveshare_s3_touch_lcd_169]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
monitor_speed = 115200
upload_speed = 921600
